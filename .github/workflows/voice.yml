# Makes an episode's narration with Gemini TTS (voice Achird), using the repo secret GEMINI_API_KEY, which only
# Actions can read. Output: artifact voice-<slug> with voice.wav, words.json, joins.json. The render reads them.
# Runs when an episode script changes (only those episodes), or by hand (blank slug = every Gemini episode).
# Raw takes from earlier runs on any branch are restored first, so an unchanged script never costs a request.
name: voice
on:
  push:
    paths:
      - "buhexplains/episodes/**/episode.json"
      - "buhexplains/pipeline/voice.py"
      - ".github/workflows/voice.yml"
  workflow_dispatch:
    inputs:
      slug:
        description: "episode slug (blank = every Gemini episode)"
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/models/whisper
          key: whisper-base-en-v1
      - uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-${{ hashFiles('buhexplains/episodes/**/episode.json', 'buhexplains/pipeline/voice.py') }}
          restore-keys: tts-
      - name: raw takes from earlier runs (any branch), so unchanged scripts never cost a Gemini request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/tts
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow voice.yml --status completed --json databaseId --limit 15 -q '.[].databaseId'); do
            rm -rf _v && gh run download "$run" --repo "$GITHUB_REPOSITORY" -n voice -D _v 2>/dev/null || continue
            cp -n _v/.cache/tts/*.wav .cache/tts/ 2>/dev/null || true
          done
          ls .cache/tts | wc -l
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q numpy soundfile librosa faster-whisper yt-dlp
      - name: narrate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_ONLY: "1"
          SLUG: ${{ inputs.slug }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          slugs="$SLUG"
          if [ -z "$slugs" ] && [ "$EVENT" = "push" ]; then
            # only the episodes whose script changed in this push; a brand-new branch (BEFORE all zeros) voices nothing
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              slugs=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'buhexplains/episodes/*/episode.json' | cut -d/ -f3 | sort -u)
            fi
            [ -z "$slugs" ] && echo "no episode script changed in this push: nothing to voice"
          elif [ -z "$slugs" ]; then
            slugs=$(for f in buhexplains/episodes/*/episode.json; do python -c "import json,sys;e=json.load(open('$f'));print(e['slug'] if e['voice'].get('engine')=='gemini' else '')"; done)
          fi
          for s in $slugs; do
            echo "== $s"
            python buhexplains/pipeline/fetch_assets.py "$s"
            python buhexplains/pipeline/voice.py "$s"
          done
          echo "SLUGS=$(echo $slugs | tr ' ' ',')" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        if: always()   # keep Gemini's raw take even when a line check fails (a lost take costs another request)
        with:
          name: voice
          path: |
            out/*/voice.wav
            out/*/words.json
            out/*/joins.json
            .cache/tts/*.wav
          retention-days: 30
          include-hidden-files: true
